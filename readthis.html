<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JAGI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 10px;

            background: #d9c3a5;

            font-family: "Comic Sans MS", cursive;
        }


        /* =========================
           NOTEBOOK
        ========================= */

        .notebook {
            width: 100%;
            max-width: 430px;

            height: 90vh;
            min-height: 600px;

            background: #fffdf2;

            border-left: 12px solid #8b5e3c;

            border-radius: 12px;

            position: relative;

            overflow: hidden;

            box-shadow:
                0 15px 35px rgba(0,0,0,0.25);
        }


        /* =========================
           RINGS
        ========================= */

        .rings {
            position: absolute;

            left: -10px;
            top: 25px;
            bottom: 25px;

            display: flex;

            flex-direction: column;

            justify-content: space-around;

            z-index: 20;
        }


        .ring {
            width: 23px;
            height: 23px;

            border: 4px solid #777;

            border-radius: 50%;

            background: #ddd;

            box-shadow:
                inset 2px 2px 3px #555;
        }


        /* =========================
           BLANK PAGE
        ========================= */

        .page {
            width: 100%;
            height: 100%;

            position: relative;

            overflow: hidden;

            background-color: #fffdf2;
            background-image: none;

            padding: 45px 35px 70px 50px;
            color: #333;
            font-size: 16px;
            line-height: 1.6;

            animation: pageIn 0.35s ease;
        }


        /* =========================
           COVER
        ========================= */

        .cover {
            width: 100%;
            height: 100%;

            display: flex;

            justify-content: center;
            align-items: center;

            flex-direction: column;

            text-align: center;

            background:
                linear-gradient(
                    135deg,
                    #6c8ebf,
                    #89a9d0
                );

            color: white;
        }


        .cover-icon {
            font-size: 70px;

            margin-bottom: 20px;
        }


        .cover h1 {
            font-size: 35px;

            margin-bottom: 10px;

            color: white;
        }


        .cover p {
            font-size: 16px;

            color: white;
        }


        /* =========================
           TAPE
        ========================= */

        .tape {
            position: absolute;

            width: 90px;
            height: 24px;

            top: 20px;
            right: 40px;

            background:
                rgba(255, 220, 130, 0.7);

            transform: rotate(5deg);

            z-index: 5;
        }


        /* =========================
           BUTTONS
        ========================= */

        .controls {
            position: absolute;

            bottom: 12px;

            left: 0;
            right: 0;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 10px;

            z-index: 30;
        }


        button {
            border: none;

            padding: 10px 17px;

            border-radius: 20px;

            background: #5d7fa3;

            color: white;

            font-family: inherit;

            font-size: 14px;

            cursor: pointer;

            transition: 0.2s;
        }


        button:hover {
            background: #456887;

            transform: translateY(-2px);
        }

        


        button:active {
            transform: scale(0.95);
        }


        button:disabled {
            opacity: 0.35;

            cursor: not-allowed;
        }


        #pageNumber {
            font-size: 13px;

            color: #555;
        }

        


        /* =========================
           PAGE ANIMATION
        ========================= */

        @keyframes pageIn {

            from {
                opacity: 0;

                transform:
                    rotateY(-8deg)
                    translateX(15px);
            }

            to {
                opacity: 1;

                transform:
                    rotateY(0)
                    translateX(0);
            }

        }


        /* =========================
           SMALL PHONE
        ========================= */

        @media (max-width: 380px) {

            body {
                padding: 5px;
            }


            .notebook {
                height: 94vh;

                border-left-width: 9px;
            }


            .page::before {
                left: 27px;
            }


            .cover h1 {
                font-size: 30px;
            }


            .cover-icon {
                font-size: 60px;
            }


            button {
                padding: 9px 13px;

                font-size: 12px;
            }

        }


        /* =========================
           READ LETTER BUTTON
        ========================= */

        .read-btn {
            display: inline-block;
            padding: 14px 24px;
            background: linear-gradient(135deg, #ff9ecf, #c77dff);
            color: white;
            text-decoration: none;
            font-family: "Comic Sans MS", cursive;
            font-weight: bold;
            font-size: 15px;
            border-radius: 30px;
            box-shadow: 0 6px 15px rgba(199, 125, 255, 0.35);
            transition: all 0.3s ease;
            text-align: center;
        }

        .read-btn:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 10px 25px rgba(199, 125, 255, 0.5);
        }

        .read-btn:active {
            transform: scale(0.95);
        }

    </style>

</head>

            `,

            


            
        ];
        


        /* =========================
           CURRENT PAGE
        ========================= */

        let currentPage = 0;


        /* =========================
           SHOW PAGE
        ========================= */

        function showPage() {

            document.getElementById("book").innerHTML =
                pages[currentPage];


            document.getElementById("pageNumber").textContent =
                `Page ${currentPage + 1} / ${pages.length}`;


            document.getElementById("prevBtn").disabled =
                currentPage === 0;


            document.getElementById("nextBtn").disabled =
                currentPage === pages.length - 1;

        }


        /* =========================
           NEXT
        ========================= */

        function nextPage() {

            if (currentPage < pages.length - 1) {

                currentPage++;

                showPage();

            }

        }


        /* =========================
           PREVIOUS
        ========================= */

        function previousPage() {

            if (currentPage > 0) {

                currentPage--;

                showPage();

            }

        }


        /* =========================
           KEYBOARD
        ========================= */

        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "ArrowRight") {
                    nextPage();
                }

                if (event.key === "ArrowLeft") {
                    previousPage();
                }

            }
        );


        /* START */

        showPage();

    </script>

</html>
