<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>music</title>

    <style>

        
        :root {
            --spotify: #1DB954;
            --spotify-dark: #0b7a38;
            --glass: rgba(18, 18, 18, 0.72);
            --glass-light: rgba(255, 255, 255, 0.10);
            --text: #ffffff;
            --muted: #b3b3b3;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(29,185,84,0.22), transparent 32%),
                radial-gradient(circle at 80% 80%, rgba(29,185,84,0.16), transparent 30%),
                linear-gradient(135deg, #07150d, #101010 48%, #052a15);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        .player {
            width: 350px;
            max-width: 100%;
            background: var(--glass);
            padding: 25px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.16);
            box-shadow:
                0 25px 60px rgba(0,0,0,0.55),
                inset 0 1px 0 rgba(255,255,255,0.12);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            text-align: center;
        }

        /* COVER PHOTO */
        .cover {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 18px;
            margin: 0 auto 20px;
            display: block;
            box-shadow:
                0 18px 35px rgba(0,0,0,0.45),
                0 0 35px rgba(29,185,84,0.12);
            border: 1px solid rgba(255,255,255,0.14);
        }

        .song-title {
            margin: 15px 0;
        }

        .song-title h2 {
            margin-bottom: 5px;
            color: #fff;
            font-size: 24px;
        }

        .song-title p {
            color: var(--muted);
            margin-top: 0;
            font-size: 14px;
        }

        .buttons {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: nowrap;
            gap: 4px;
        }

        button {
            padding: 10px 11px;
            margin: 3px;
            flex: 1 1 0;
            min-width: 0;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            cursor: pointer;
            background: rgba(255,255,255,0.08);
            color: white;
            font-weight: 600;
            transition: 0.2s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        button:hover {
            background: var(--spotify);
            color: #061b0d;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(29,185,84,0.25);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--spotify);
            cursor: pointer;
        }

        .volume {
            margin-top: 15px;
            color: var(--muted);
        }

        .lyrics {
            margin-top: 15px;
            height: 200px;
            overflow-y: auto;
            background: var(--glass-light);
            border: 1px solid rgba(255,255,255,0.10);
            padding: 15px;
            border-radius: 16px;
            line-height: 2;
            text-align: center;
            white-space: pre-line;
            color: #e8e8e8;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            scrollbar-width: thin;
            scrollbar-color: var(--spotify) transparent;
        }

        .lyrics::-webkit-scrollbar {
            width: 5px;
        }

        .lyrics::-webkit-scrollbar-thumb {
            background: var(--spotify);
            border-radius: 10px;
        }

        h3 {
            color: var(--spotify);
            margin-bottom: 8px;
        }

        @media (max-width: 420px) {
            body {
                padding: 12px;
            }

            .player {
                width: 100%;
                padding: 20px;
                border-radius: 22px;
            }

            .cover {
                width: min(250px, 78vw);
                height: min(250px, 78vw);
            }

            .song-title h2 {
                font-size: 21px;
            }

            .buttons {
                gap: 2px;
            }

            .buttons button {
                padding: 9px 5px;
                margin: 2px;
                font-size: 11px;
                white-space: nowrap;
            }
        }


    </style>

</head>

    let currentSong = 0;



    // ================================
    // LOAD SONG
    // ================================

    function loadSong(index) {


        const song =
            songs[index];


        title.innerText =
            song.title;


        artist.innerText =
            song.artist;


        music.src =
            song.file;


        cover.src =
            song.cover;


        lyrics.innerText =
            song.lyrics;


        progress.value = 0;

    }



    // ================================
    // PLAY / PAUSE
    // ================================

    function playPause() {


        if (music.paused) {

            music.play();

        }

        else {

            music.pause();

        }

    }



    // ================================
    // NEXT SONG
    // ================================

    function nextSong() {


        currentSong++;


        if (
            currentSong >=
            songs.length
        ) {

            currentSong = 0;

        }


        loadSong(currentSong);


        music.play();

    }



    // ================================
    // PREVIOUS SONG
    // ================================

    function previousSong() {


        currentSong--;


        if (currentSong < 0) {

            currentSong =
                songs.length - 1;

        }


        loadSong(currentSong);


        music.play();

    }



    // ================================
    // AUTO NEXT
    // ================================

    music.addEventListener(
        "ended",
        function() {

            nextSong();

        }
    );



    // ================================
    // PROGRESS BAR
    // ================================

    music.addEventListener(
        "timeupdate",
        function() {


            if (music.duration) {


                progress.value =

                    (music.currentTime /
                    music.duration) * 100;

            }

        }
    );



    // ================================
    // CHANGE SONG POSITION
    // ================================

    progress.addEventListener(
        "input",
        function() {


            if (music.duration) {


                music.currentTime =

                    (progress.value / 100) *
                    music.duration;

            }

        }
    );



    // ================================
    // VOLUME
    // ================================

    volume.addEventListener(
        "input",
        function() {

            music.volume =
                volume.value;

        }
    );



    // ================================
    // FIRST SONG
    // ================================

    loadSong(currentSong);


    music.volume = 0.8;


</script>
