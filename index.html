<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>JAGI</title>


<style>

/* ================= GENERAL ================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #121212;
    color: white;
}


/* ================= NAVBAR ================= */

nav {
    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    height: 65px;

    background: #000;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 7%;

    z-index: 999;
}

.logo {
    color: #1DB954;

    font-size: 21px;
    font-weight: bold;

    white-space: nowrap;
}

nav ul {
    display: flex;

    gap: 25px;

    list-style: none;
}

nav a {
    color: #aaa;

    text-decoration: none;

    font-size: 14px;

    cursor: pointer;

    transition: .3s;
}

nav a:hover {
    color: #1DB954;
}


/* ================= PAGE ================= */

.page {
    min-height: 100vh;

    padding: 100px 7% 60px;
}


/* ================= HOME ================= */

#home {

    min-height: 100vh;

    display: flex;

    align-items: center;

    background:
        radial-gradient(
            circle at 80% 50%,
            #1b5e36 0%,
            transparent 35%
        ),
        #121212;
}

.home-content {
    max-width: 700px;
}

.small-text {

    color: #1DB954;

    font-size: 14px;

    font-weight: bold;

    letter-spacing: 3px;

    margin-bottom: 18px;
}

.home-content h1 {

    font-size:
        clamp(50px, 9vw, 90px);

    line-height: 1;

    margin-bottom: 25px;
}

.home-content h1 span {
    color: #1DB954;
}

.home-content p {

    color: #aaa;

    font-size: 17px;

    line-height: 1.7;

    max-width: 600px;

    margin-bottom: 30px;
}


/* ================= BUTTON ================= */

.btn {

    display: inline-block;

    background: #1DB954;

    color: #000;

    padding: 14px 28px;

    border-radius: 30px;

    text-decoration: none;

    font-weight: bold;

    transition: .3s;
}

.btn:hover {

    background: #1ed760;

    transform: scale(1.05);
}


/* ================= TITLES ================= */

.section-title {

    font-size: 36px;

    margin-bottom: 30px;
}

.section-title span {
    color: #1DB954;
}


/* ================= GALLERY ================= */

.gallery {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(180px, 1fr)
        );

    gap: 20px;
}

.photo-card {

    background: #181818;

    padding: 15px;

    border-radius: 10px;

    transition: .3s;
}

.photo-card:hover {

    background: #242424;

    transform: translateY(-5px);
}

.photo-card img {

    width: 100%;

    aspect-ratio: 1 / 1;

    object-fit: cover;

    border-radius: 7px;
}

.photo-card h3 {

    margin-top: 12px;
}

.photo-card p {

    color: #aaa;

    margin-top: 5px;

    font-size: 14px;
}


/* ================= MUSIC ================= */

.song {

    background: #181818;

    padding: 20px;

    border-radius: 12px;

    margin-bottom: 18px;

    display: flex;

    align-items: center;

    gap: 20px;

    transition: .3s;
}

.song:hover {
    background: #242424;
}

.song-cover {

    width: 90px;
    height: 90px;

    object-fit: cover;

    border-radius: 7px;
}

.song-info {
    flex: 1;
}

.song-info h3 {
    margin-bottom: 5px;
}

.song-info p {

    color: #aaa;

    font-size: 14px;

    margin-bottom: 12px;
}

audio {

    width: 100%;

    max-width: 500px;
}


/* ================= VIDEO ================= */

.video-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(280px, 1fr)
        );

    gap: 20px;
}

.video-card {

    background: #181818;

    padding: 15px;

    border-radius: 10px;
}

.video-card video {

    width: 100%;

    border-radius: 8px;
}

.video-card h3 {

    margin-top: 12px;
}


/* ================= ABOUT ================= */

.about-box {

    max-width: 800px;

    background: #181818;

    padding: 40px;

    border-radius: 15px;

    border-left:
        4px solid #1DB954;
}

.about-box p {

    color: #aaa;

    line-height: 1.8;

    font-size: 16px;
}


/* ================= FOOTER ================= */

footer {

    background: #000;

    color: #777;

    text-align: center;

    padding: 20px;
}

footer span {
    color: #1DB954;
}


/* ================================================= */
/* ================= MOBILE ======================== */
/* ================================================= */

@media (max-width: 600px) {


    /* ================= NAVIGATION ================= */

    nav {

        height: 60px;

        padding: 0 10px;

    }


    .logo {

        font-size: 12px;

    }


    nav ul {

        gap: 8px;

    }


    nav a {

        font-size: 9px;

    }



    /* ================= PAGE ================= */

    .page {

        min-height: 100vh;

        padding:
            80px
            15px
            40px;

    }



    /* ================= HOME ================= */

    #home {

        min-height: 100vh;

        padding:
            80px
            20px
            40px;

    }


    .home-content {

        width: 100%;

    }


    .small-text {

        font-size: 10px;

        letter-spacing: 2px;

    }


    .home-content h1 {

        font-size: 42px;

        line-height: 1.05;

    }


    .home-content p {

        font-size: 14px;

        line-height: 1.6;

    }


    .btn {

        padding:
            12px
            22px;

        font-size: 13px;

    }



    /* ================= TITLES ================= */

    .section-title {

        font-size: 27px;

        margin-bottom: 20px;

    }



    /* ================= GALLERY ================= */

    .gallery {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 10px;

    }


    .photo-card {

        padding: 9px;

        border-radius: 8px;

    }


    .photo-card h3 {

        font-size: 13px;

    }


    .photo-card p {

        font-size: 10px;

    }



    /* ================= MUSIC ================= */

    .song {

        flex-direction: column;

        align-items: flex-start;

        padding: 15px;

    }


    .song-cover {

        width: 100%;

        max-width: 250px;

        height: auto;

        aspect-ratio: 1;

        margin: auto;

    }


    .song-info {

        width: 100%;

    }


    .song-info h3 {

        font-size: 16px;

    }


    .song-info p {

        font-size: 12px;

    }


    audio {

        width: 100%;

    }



    /* ================= VIDEO ================= */

    .video-grid {

        grid-template-columns: 1fr;

        gap: 15px;

    }


    .video-card {

        padding: 10px;

    }



    /* ================= ABOUT ================= */

    .about-box {

        padding: 20px;

    }


    .about-box p {

        font-size: 14px;

        line-height: 1.7;

    }



    /* ================= FOOTER ================= */

    footer {

        font-size: 11px;

        padding: 15px;

    }

}

</style>
